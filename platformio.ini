; Proyecto: prueba de la camara ESP32-CAM (AI Thinker, sensor OV2640)
; Endpoints compatibles con el firmware de AnimalSense (/capture y /status)
; + pagina de prueba en "/" y stream MJPEG en ":81/stream".

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Con la base ESP32-CAM-MB las lineas DTR/RTS dejan la placa en reset
; al abrir el monitor: las desactivamos.
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
